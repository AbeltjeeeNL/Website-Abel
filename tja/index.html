<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>/home/abel/tja</title>
    <link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>😂</text></svg>">
    <script defer src="https://analytics.dawg.network/script.js" data-website-id="a50b0873-25db-42a5-b79e-061b0f1ef6b9"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <script>
    if (sessionStorage.getItem("geverifieerd") !== "true") {
        window.location.replace("../verificatie");
    }
    </script>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }

        img {
            width: 100vw;
            height: 100vh;
        }

        #clickOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: default;
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            background-color: black;
            font-size: 24px;
            font-family: Inter;
        }
    </style>
</head>
<body>
    <img src="prullenbak.png">
    <div id="clickOverlay">Click anywhere</div>
    <audio id="audio" loop playsinline>
        <source src="geluid.mp3" type="audio/mp3">
        Uw browser ondersteunt het audio-element niet (Your browser does not support the audio element)
    </audio>

    <script>
        function requestFullscreen(element) {
            if (element.requestFullscreen) {
                element.requestFullscreen();
            } else if (element.webkitRequestFullscreen) {
                element.webkitRequestFullscreen();
            } else if (element.msRequestFullscreen) {
                element.msRequestFullscreen();
            }
        }

        function start() {
            try {
                requestFullscreen(document.documentElement);
            } catch (e) {}
            var audio = document.getElementById('audio');
            var playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.catch(function(error) {
                    document.getElementById('clickOverlay').style.display = 'flex';
                });
            }
            document.getElementById('clickOverlay').style.display = 'none';
        }

        document.getElementById('clickOverlay').addEventListener('click', start);
        document.getElementById('clickOverlay').addEventListener('touchstart', start);
        document.addEventListener('keydown', start);
    </script>
</body>
</html>
